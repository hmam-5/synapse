# ============================================================
# SYNAPSE: Nginx Reverse Proxy — Initial HTTP Configuration
# Server: 164.92.205.65 (DigitalOcean Droplet)
#
# This config serves HTTP traffic immediately on deploy.
# To upgrade to HTTPS later:
#   1. Install certbot on the Droplet
#   2. Run: certbot certonly --webroot -w /var/www/certbot -d yourdomain.com
#   3. Swap this file for the SSL-enabled nginx.conf
# ============================================================

upstream synapse_app {
    server synapse-web:3000;
    keepalive 64;
}

# ---- Rate Limiting Zones ----
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

server {
    listen 80;
    server_name 164.92.205.65;

    # ---- Gzip Compression ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    client_max_body_size 50M;

    # ---- Security Headers ----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ---- Let's Encrypt ACME Challenge (for future SSL) ----
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ---- Auth endpoints (strict rate limit) ----
    location /auth {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://synapse_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ---- API endpoints (moderate rate limit) ----
    location /api {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://synapse_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ---- Static assets (immutable cache) ----
    location /_next/static {
        proxy_pass http://synapse_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ---- Everything else ----
    location / {
        proxy_pass http://synapse_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
